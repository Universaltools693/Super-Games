<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Games - Ultimate Gaming Universe</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <!-- Google Fonts for premium typography (open-source) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400&family=Exo+2:wght@700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons (open-source) -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!-- AdSense Script (Placeholder - Add your AdSense code here after approval) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=YOUR_ADSENSE_CLIENT_ID" crossorigin="anonymous"></script>
</head>
<body>
    <div class="bg-video">
        <video autoplay muted loop playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>
    </div>
    <div class="overlay"></div>
    <header class="header">
        <img src="logo-512.png" alt="Super Games Logo" class="logo">
        <h1 class="site-title">Super Games</h1>
        <p class="tagline">Ultimate Gaming Universe</p>
    </header>
    <!-- AdSense Ad Unit (Placeholder - Add your ad unit code here) -->
    <div class="ad-container">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="YOUR_ADSENSE_CLIENT_ID"
             data-ad-slot="YOUR_AD_SLOT_ID"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
    <main>
        <section class="search-section">
            <input type="text" id="searchBar" placeholder="Search 200+ Games..." class="search-bar">
        </section>
        <section id="categories" class="category-section">
            <h2 class="section-title">Categories</h2>
            <div id="categoryList" class="category-list">
                <!-- Categories populated by JS -->
            </div>
        </section>
        <section id="games" class="games-section">
            <h2 class="section-title">Games</h2>
            <div id="gameList" class="game-grid">
                <!-- Games populated by JS -->
            </div>
        </section>
        <div id="gameModal" class="game-modal">
            <div class="game-modal-content">
                <button class="exit-btn">Exit</button>
                <iframe id="gameFrame" class="game-frame" frameborder="0" allowfullscreen></iframe>
                <p id="gameMessage" class="game-message"></p>
            </div>
        </div>
    </main>
    <!-- AdSense Ad Unit (Footer Ad - Placeholder) -->
    <div class="ad-container footer-ad">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="YOUR_ADSENSE_CLIENT_ID"
             data-ad-slot="YOUR_FOOTER_AD_SLOT_ID"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
    <footer class="footer">
        <p>All Rights Reserved by Vikas Tiwari (Owner)</p>
    </footer>
    <!-- GSAP and ScrollTrigger for animations (open-source) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
