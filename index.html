<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Games - Awesome Old Memories</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <img src="logo.png" alt="Super Games Logo" class="logo">
        <h1 class="site-title">Super Games</h1>
        <p class="tagline">Awesome Old Memories</p>
    </header>
    <main>
        <section class="search-section">
            <input type="text" id="searchBar" placeholder="Search 200+ Games..." class="search-bar">
        </section>
        <section id="categories" class="category-section">
            <h2 class="section-title">Categories</h2>
            <div id="categoryList" class="category-list">
                <!-- Categories populated by JS -->
            </div>
        </section>
        <section id="games" class="games-section">
            <h2 class="section-title">Games</h2>
            <div id="gameList" class="game-grid">
                <!-- Games populated by JS -->
            </div>
        </section>
        <div id="gameModal" class="game-modal">
            <div class="game-modal-content">
                <span class="close-modal">&times;</span>
                <iframe id="gameFrame" class="game-frame" frameborder="0"></iframe>
                <p id="gameMessage" class="game-message"></p>
            </div>
        </div>
    </main>
    <footer class="footer">
        <p>All Rights Reserved by Vikas Tiwari (Owner)</p>
    </footer>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
